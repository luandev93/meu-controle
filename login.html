<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Controle Pessoal — Acesso</title>
<meta name="theme-color" content="#0F1417">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0F1417;
    --surface:#161D22;
    --border:#2A343B;
    --text:#E9EEF0;
    --text-dim:#8CA0AA;
    --text-faint:#5B6B73;
    --accent:#4FB8A8;
    --danger:#D9695F;
    --font-sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    height:100vh;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:340px;
    text-align:center;
  }
  .mascot{
    width:120px;
    height:120px;
    margin:0 auto 20px;
    animation:bounce 2.2s ease-in-out infinite;
    filter:drop-shadow(0 10px 20px rgba(79,184,168,0.18));
  }
  @keyframes bounce{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-14px) rotate(-4deg);}
  }
  @media (prefers-reduced-motion:reduce){
    .mascot{animation:none;}
  }
  .wordmark{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-size:19px;
    font-weight:600;
    margin:0 0 26px 0;
    letter-spacing:-0.01em;
  }
  form{display:flex;flex-direction:column;gap:12px;}
  input[type="password"]{
    width:100%;
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:11px;
    padding:14px 16px;
    color:var(--text);
    font-family:var(--font-mono);
    font-size:16px;
    text-align:center;
    letter-spacing:0.1em;
    outline:none;
    transition:border-color .15s;
  }
  input[type="password"]:focus{border-color:var(--accent);}
  .btn{
    background:var(--accent);
    color:#0B1210;
    border:none;
    border-radius:11px;
    padding:14px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s;
  }
  .btn:active{opacity:0.85;}
  .error{
    color:var(--danger);
    font-size:12.5px;
    margin:-2px 0 0 0;
    display:none;
  }
  .error.show{display:block;}
</style>
</head>
<body>
<div class="card">
  <img class="mascot" src="icon-512.png" alt="">
  <div class="wordmark">Controle · Pessoal</div>
  <h1>Acesso restrito</h1>
  <form method="POST" action="/login">
    <input type="password" name="password" placeholder="Senha" autocomplete="current-password" autofocus>
    <p class="error" id="login-error">Senha incorreta. Tente de novo.</p>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>
<script>
  if (new URLSearchParams(location.search).get('erro') === '1') {
    document.getElementById('login-error').classList.add('show');
  }
</script>
</body>
</html>
